# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# https://packaging.python.org/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: Upload Python Package

on:
  push:
    branches:
      - rc
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Nothing reaches an index without the test suite having run on the very commit
  # that is about to be published.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.11"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --all-extras --group dev --group test

      - name: Run pytest
        run: uv run pytest -v

      - name: Ruff (lint)
        run: uv run ruff check

      # A release tag that disagrees with pyproject.toml would publish a version nobody
      # can find from the GitHub release page.
      - name: Check that the tag matches the package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          TAG=${GITHUB_REF#refs/tags/}
          echo "pyproject.toml: $VERSION"
          echo "release tag   : $TAG"
          if [ "$TAG" != "v$VERSION" ] && [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match the version '$VERSION' in pyproject.toml."
            exit 1
          fi

  pypi-publish:
    name: Upload release to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mmg
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v7

      # Setup Python and uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.11"

      - name: Set up Python
        run: uv python install 3.11

      # Build
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build package
        run: uv build --no-sources

      # Debugging information
      - name: Debug event info
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "GitHub ref: ${{ github.ref }}"
          echo "Is release: ${{ github.event_name == 'release' }}"
          echo "Release action: ${{ github.event.action }}"

      # Publish to PyPI Test (when rc branch is pushed)
      - name: Publish package to TestPyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rc')
        run: uv publish --index testpypi

      # Publish to PyPI (when a release is published)
      - name: Publish package to PyPI
        if: github.event_name == 'release' && github.event.action == 'published'
        run: uv publish
